name: workflow-check
on:
  push:
    branches: [main]  # branches are checked through their pull request: one run per commit, not two
  pull_request:
concurrency:  # a newer commit on the same PR (or main) cancels the run of the older one
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]  # baseline and latest; the tools stay stdlib-only
    env:
      WF_REQUIRE_JSONSCHEMA: "1"  # contract schema tests must run in CI, never be skipped
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # --git: approval before code, revisions after closure
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: python -m pip install jsonschema  # test dependency only
      - run: make check
      - run: python tools/check_workflow.py --git
      - run: make test-tools
  secrets:  # code and workflow artifacts alike; gitleaks plus the stdlib scanner the pre-commit hook uses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 tools/secret_scan.py
  other-os:  # all tools tests on the other OSes (NFR-10; Linux is covered above): paths, console encoding, launcher
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      WF_TEST_TIMEOUT: "300"  # seconds: a hang dumps the stacks instead of running until the job timeout
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }  # launcher baseline
      - run: python -m unittest discover -s tools/tests -v
