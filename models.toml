# Model per task tier, per vendor. Steps declare a tier, never a model.
#   fast     → state, routing, journal, simple edits         (cheap, low latency)
#   balanced → analysis, requirements, coding, review         (default workhorse)
#   deep     → architecture, L/XL stories, hard debugging      (use sparingly, or when asked)
#
# Change with `/choose-models` or by hand, then run `make agents` to regenerate the adapters.
# Suggestions marked "verify" change often: check the vendor's current model list.

[vendors.anthropic]
fast = "haiku"               # Claude Code aliases resolve to the latest model of each family
balanced = "sonnet"
deep = "opus"

[vendors.openai]             # verify
fast = "gpt-5-mini"
balanced = "gpt-5-codex"
deep = "gpt-5"

[vendors.google]             # verify
fast = "gemini-2.5-flash"
balanced = "gemini-2.5-pro"
deep = "gemini-2.5-pro"

# Tools to generate adapters for. `vendor` picks the column above; `models` overrides single tiers
# with the exact name the tool expects (e.g. Copilot's model picker labels).

[tools.claude-code]
enabled = true
vendor = "anthropic"

[tools.codex]
enabled = true
vendor = "openai"

[tools.copilot]
enabled = true
vendor = "anthropic"
models = { fast = "Claude Haiku 5.5", balanced = "Claude Sonnet 5.5", deep = "Claude Opus 5.5" }   # verify labels in the Copilot model picker

[tools.cursor]
enabled = true
vendor = "anthropic"
